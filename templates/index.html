<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyMeeting</title>
  <meta name="description" content="Turn meeting recordings into clear notes, decisions and action items. Runs on your own computer.">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var saved = localStorage.getItem("mymeeting-theme");
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
      } catch (e) {}
    })();
  </script>
</head>
<body data-exts="{{ allowed_exts }}" data-max-mb="{{ max_mb }}">
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Notes history">
      <div class="sb-top">
        <a class="brand" href="#/" aria-label="MyMeeting home">
          <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="32" height="32">
          <span class="brand-name">MyMeeting</span>
        </a>
        <button class="icon-btn sb-close" id="sb-close" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <a class="new-btn" id="new-btn" href="#/">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New note
      </a>

      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off">
      </label>

      <nav class="history" id="history" aria-label="Previous notes"></nav>

      <div class="sb-foot">
        <p class="engine-info">Private: recordings are processed on this computer.</p>
        <p class="engine-models">Whisper {{ whisper_model }} + {{ notes_model }}</p>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <a class="brand brand-mobile" href="#/" aria-label="MyMeeting home">
          <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="28" height="28">
          <span class="brand-name">MyMeeting</span>
        </a>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <div class="scroll" id="scroll">
        <div class="view" id="view"></div>
      </div>
    </main>
  </div>

  <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
    <div class="drop-card">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <strong>Drop your recording to attach it</strong>
      <span>MP3, WAV, M4A, MP4, WebM and more</span>
    </div>
  </div>

  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <input id="dialog-input" type="text" maxlength="120" autocomplete="off" aria-label="Title">
      <div class="dialog-actions">
        <button class="btn ghost" id="dialog-cancel" value="cancel" type="button">Cancel</button>
        <button class="btn primary" id="dialog-ok" value="ok" type="submit">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" hidden>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
